<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090D14"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="120" y1="70" x2="1020" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="0.5" stop-color="#94A3B8"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="1198" height="358" rx="24" fill="url(#bg)" stroke="#263244" stroke-width="2"/>
  <circle cx="1102" cy="72" r="8" fill="#38BDF8">
    <animate attributeName="opacity" values="0.25;1;0.25" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="1068" y="78" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" text-anchor="end">PRIVATE BUILD</text>

  <text x="72" y="92" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="3">03 / BRAND + PRODUCT</text>
  <text x="72" y="158" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="800" letter-spacing="1">THE ONE</text>
  <text x="72" y="202" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="22">streetwear × technology × interactive customization</text>

  <g transform="translate(770 56)">
    <rect width="300" height="220" rx="18" fill="#0B1220" stroke="#334155"/>
    <path d="M86 62L116 42H184L214 62L257 86L236 126L205 112V188H95V112L64 126L43 86L86 62Z" stroke="url(#accent)" stroke-width="5" fill="none" filter="url(#glow)">
      <animate attributeName="stroke-dasharray" values="0 1000;1000 0" dur="3s" repeatCount="indefinite"/>
    </path>
    <text x="150" y="151" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" text-anchor="middle">THE ONE</text>
    <text x="150" y="178" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" text-anchor="middle">BUILDING THE BRAND</text>
  </g>

  <g transform="translate(72 254)">
    <rect width="148" height="42" rx="21" fill="#111827" stroke="#334155"/>
    <text x="74" y="27" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" text-anchor="middle">STREETWEAR</text>
    <rect x="162" width="128" height="42" rx="21" fill="#111827" stroke="#334155"/>
    <text x="226" y="27" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" text-anchor="middle">3D / WEB</text>
    <rect x="304" width="126" height="42" rx="21" fill="#111827" stroke="#334155"/>
    <text x="367" y="27" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" text-anchor="middle">STARTUP</text>
  </g>
