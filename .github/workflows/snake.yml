name: Generate contribution snake

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "15 0 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Checkout contribution history
        uses: actions/checkout@v4
        with:
          repository: YashYadav007/gitContribution
          path: gitContribution
          fetch-depth: 0

      - name: Generate rolling 365-day snake
        env:
          SNAKE_TOKEN: ${{ secrets.SNAKE_TOKEN }}
        run: python3 scripts/generate_custom_snake.py

      - name: Publish snake to gh-pages branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          target_branch: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
